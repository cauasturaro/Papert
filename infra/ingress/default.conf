server {
    listen 80;
    server_name _;
    server_tokens off;
    # Uploads go straight to S3 through presigned URLs, so requests here are small JSON bodies.
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Papert-Edge "";
        proxy_buffering off;
    }
}
