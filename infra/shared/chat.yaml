AWSTemplateFormatVersion: "2010-09-09"
Description: Papert chat/analysis queues and Seymour-to-Core results queue

Resources:
  ChatQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: papert-chat
      # Six times the Seymour worker timeout, as AWS recommends for Lambda.
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - ChatDeadLetterQueue
            - Arn
        maxReceiveCount: 3

  ChatDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: papert-chat-dlq
      MessageRetentionPeriod: 1209600

  # Seymour publishes structured evaluation results here;
  # Core consumes them to validate and persist progression.
  ResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: papert-results
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - ResultsDeadLetterQueue
            - Arn
        maxReceiveCount: 3

  ResultsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: papert-results-dlq
      MessageRetentionPeriod: 1209600
