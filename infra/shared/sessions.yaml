AWSTemplateFormatVersion: "2010-09-09"
Description: Papert DynamoDB table for session state and WebSocket connection mapping

Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: papert-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
