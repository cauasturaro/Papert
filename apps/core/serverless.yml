# Core API — serverless.yml skeleton
# Deploy target: AWS Lambda (NestJS + @vendia/serverless-express)
# Local execution: npm run start:dev (see README.md — do not use sls offline for this service)
# Stage params: local | dev | prod

service: papert-core

frameworkVersion: '>=4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'local'}
  memorySize: 512
  timeout: 29 # API Gateway HTTP max
  environment:
    NODE_ENV: production
    CHAT_QUEUE_URL: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/papert-chat'
    SESSIONS_TABLE: papert-sessions
    SOURCES_BUCKET: papert-sources
    # SOURCES_PUBLIC_S3_ENDPOINT is local-only; leave it unset in AWS.
    WEBSOCKET_URL: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
    WEBSOCKET_MANAGEMENT_URL: !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
    WEB_ORIGIN: ${ssm:/papert/${self:provider.stage}/web/origin}
    AUTH_JWE_ACTIVE_KID: ${ssm:/papert/${self:provider.stage}/core/jwe-active-kid}
    AUTH_JWE_KEYS: ${ssm:/aws/reference/secretsmanager/papert/${self:provider.stage}/core/jwe-keys}
    DATABASE_URL: ${ssm:/papert/${self:provider.stage}/core/database-url, ''}
  iam:
    role:
      statements:
        # Principle of least privilege — expand as features are added
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-chat'
        - Effect: Allow
          Action:
            [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
          Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-results'
        - Effect: Allow
          Action:
            [
              dynamodb:PutItem,
              dynamodb:GetItem,
              dynamodb:Query,
              dynamodb:DeleteItem,
            ]
          Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/papert-sessions'
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:provider.stage}/POST/@connections/*'

        - Effect: Allow
          Action: [s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
          Resource: arn:aws:s3:::papert-sources/documents/*
        # Presigned viewer links are signed by Core and need read access.
        - Effect: Allow
          Action: [s3:GetObject, s3:GetObjectVersion]
          Resource:
            - arn:aws:s3:::papert-sources/documents/*
            - arn:aws:s3:::papert-sources/renditions/*
        - Effect: Allow
          Action: [s3:DeleteObject, s3:DeleteObjectVersion]
          Resource: arn:aws:s3:::papert-sources/renditions/*
        - Effect: Allow
          Action: s3:ListBucketVersions
          Resource: arn:aws:s3:::papert-sources
          Condition:
            StringLike:
              s3:prefix: [documents/*, renditions/*]

package:
  individually: true
  patterns:
    - '!node_modules/.prisma/client/libquery_engine-*'
    - 'node_modules/.prisma/client/libquery_engine-rhel-*'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /internal
          method: ANY
          authorizer:
            type: aws_iam
      - httpApi:
          path: /internal/{proxy+}
          method: ANY
          authorizer:
            type: aws_iam
    # TODO: attach to the shared HTTP API ARN from infra/shared/serverless.yml
    # httpApi:
    #   id: !ImportValue papert-shared-HttpApiId

  resultsConsumer:
    handler: dist/executions/infrastructure/handlers.results
    events:
      - sqs:
          arn: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-results'
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  executionControl:
    handler: dist/executions/infrastructure/handlers.workerControl

  executionMaintenance:
    handler: dist/executions/infrastructure/handlers.maintenance
    events:
      - schedule: rate(1 minute)

  # Only the ingestion role may invoke this function via IAM.
  sourceControl:
    handler: dist/sources/infrastructure/handlers.sourceControl

  sourceMaintenance:
    handler: dist/sources/infrastructure/handlers.maintenance
    events:
      - schedule: rate(5 minutes)

  stream:
    handler: dist/executions/infrastructure/handlers.websocket
    events:
      - websocket: $connect
      - websocket: $disconnect
      - websocket: $default

plugins:
  - serverless-offline # dev only; remove for prod deploys
