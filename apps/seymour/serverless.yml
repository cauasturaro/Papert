# Seymour API — serverless.yml skeleton
# Deploy target: AWS Lambda (FastAPI + Mangum)
# Local execution: uvicorn main:app --reload --port 3002 (see README.md)
# Stage params: local | dev | prod

service: papert-seymour

frameworkVersion: ">=4"

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'local'}
  memorySize: 1024
  timeout: 30
  environment:
    RESULTS_QUEUE_URL: !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/papert-results"
    CORE_EXECUTION_CONTROL_FUNCTION: papert-core-${self:provider.stage}-executionControl
    ENVIRONMENT: ${self:provider.stage}
    SEYMOUR_DATABASE_URL: ${ssm:/papert/${self:provider.stage}/seymour/database-url, ''}
    OPENAI_API_KEY: ${ssm:/papert/${self:provider.stage}/seymour/openai-api-key, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-5.4-nano-2026-03-17'}
    LANGFUSE_BASE_URL: ${ssm:/papert/${self:provider.stage}/seymour/langfuse-url, ''}
    LANGFUSE_PUBLIC_KEY: ${ssm:/papert/${self:provider.stage}/seymour/langfuse-public-key, ''}
    LANGFUSE_SECRET_KEY: ${ssm:/papert/${self:provider.stage}/seymour/langfuse-secret-key, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-chat"
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-results"
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:papert-core-${self:provider.stage}-executionControl"

package:
  patterns:
    - "!.venv/**"
    - "!tests/**"
    - "!__pycache__/**"
    - "!*.pyc"
    - "!.env*"
    - "!evals/**"

functions:
  api:
    handler: mangum_handler.handler
    events:
      - httpApi:
          path: /internal/seymour/{proxy+}
          method: ANY
          authorizer:
            type: aws_iam
    # TODO: attach to the shared HTTP API ARN

  worker:
    handler: worker_handler.handler
    timeout: 30
    events:
      - sqs:
          arn: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:papert-chat"
          batchSize: 1
          functionResponseType: ReportBatchItemFailures
