name: Images

on:
  push:
    branches: [main]
    paths:
      ["apps/**", "infra/**", ".dockerignore", ".github/workflows/images.yml"]
  pull_request:
    paths:
      ["apps/**", "infra/**", ".dockerignore", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            context: apps/core
            file: apps/core/Dockerfile
            smoke: node -e "import('./dist/lambda.js')"
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
            smoke: node --check server.js
          - name: seymour
            context: apps/seymour
            file: apps/seymour/Dockerfile
            smoke: python -c "import main, tiktoken; tiktoken.encoding_for_model('text-embedding-3-small')"
          - name: runner
            context: .
            file: infra/runner/Dockerfile
            smoke: >-
              node -e "import('./apps/core/dist/lambda.js')" &&
              (cd apps/seymour && python -c "import src.executions.infrastructure.sqs") &&
              (cd apps/ingestion && python -c "import src.handler")
          - name: core-lambda
            context: .
            file: apps/core/Dockerfile.lambda
            smoke: node -e "import('./dist/lambda.js')"
          - name: seymour-lambda
            context: .
            file: apps/seymour/Dockerfile.lambda
            smoke: python -c "import mangum_handler, worker_handler, tiktoken; tiktoken.encoding_for_model('text-embedding-3-small')"
          - name: ingestion-lambda
            context: .
            file: apps/ingestion/Dockerfile.lambda
            smoke: python -c "import src.handler"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          provenance: false
          tags: papert-check:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Import image entrypoints as runtime user
        env:
          SMOKE: ${{ matrix.smoke }}
        run: docker run --rm --entrypoint /bin/sh -e AWS_EC2_METADATA_DISABLED=true papert-check:${{ matrix.name }} -c "$SMOKE"

      - name: Scan runtime image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --scanners vuln --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL
          papert-check:${{ matrix.name }}

      - name: Generate image SBOM
        if: always()
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --format cyclonedx papert-check:${{ matrix.name }} > sbom.json

      - name: Upload image SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.json
