name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend lint, build, unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_DB: papert
          POSTGRES_USER: papert_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U papert_admin -d papert"
          --health-interval 5s --health-timeout 5s --health-retries 10
      floci:
        image: floci/floci@sha256:954ea3f472c85c569569ab81d8e79a28dd15a769c10ab8374c106537aa45fc1d
        ports: [4566:4566]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: papert
      CORE_DB_PASSWORD: ci-core-password
      SEYMOUR_DB_PASSWORD: ci-seymour-password
      DATABASE_URL: postgresql://core_user:ci-core-password@localhost:5432/papert?schema=core
      AUTH_TEST_DATABASE_URL: postgresql://core_user:ci-core-password@localhost:5432/papert?schema=core
      EXECUTION_TEST_AWS_ENDPOINT: http://localhost:4566
      SEYMOUR_DATABASE_URL: postgresql+asyncpg://seymour_user:ci-seymour-password@localhost:5432/papert
      SEYMOUR_TEST_DYNAMODB_ENDPOINT: http://localhost:4566
      SEYMOUR_TEST_DATABASE_URL: postgresql://seymour_user:ci-seymour-password@localhost:5432/papert
      INGESTION_TEST_DATABASE_URL: postgresql://seymour_user:ci-seymour-password@localhost:5432/papert
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/core/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/seymour/requirements*.txt
            apps/ingestion/requirements*.txt
            infra/requirements-checks.txt

      - name: Create Seymour development environment
        run: |
          python -m venv apps/seymour/.venv
          echo "$GITHUB_WORKSPACE/apps/seymour/.venv/bin" >> "$GITHUB_PATH"

      - name: Install backend and infrastructure dependencies
        run: |
          npm ci --prefix apps/core
          python -m pip install -r apps/seymour/requirements-dev.txt -r apps/ingestion/requirements-dev.txt -r infra/requirements-checks.txt

      - name: Lint backend and infrastructure
        run: |
          npm run lint --prefix apps/core
          (cd apps/seymour && python -m ruff check . && pyright)
          (cd apps/ingestion && python -m ruff check src tests)
          python -m ruff check infra
          python -m ruff format --check infra

      - name: Validate deployment contracts
        run: make check-serverless

      - name: Initialize isolated database schemas
        env:
          PGUSER: papert_admin
          PGPASSWORD: ci-only-password
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
          psql -v ON_ERROR_STOP=1 -v core_password="$CORE_DB_PASSWORD" -v seymour_password="$SEYMOUR_DB_PASSWORD" -f infra/postgres/setup-schemas.sql

      - name: Validate Prisma schema, build and apply migrations
        working-directory: apps/core
        run: |
          npx prisma validate
          npm run build
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Apply Seymour migrations and verify database isolation
        run: |
          (cd apps/seymour && python -m alembic upgrade head)
          make check-isolation ISOLATION_PSQL=psql

      - name: Core unit and integration tests with coverage
        working-directory: apps/core
        run: |
          test -n "$AUTH_TEST_DATABASE_URL"
          test -n "$EXECUTION_TEST_AWS_ENDPOINT"
          npm run test:cov
          npm run test:e2e

      - name: Create DynamoDB checkpoint integration table
        run: |
          aws --endpoint-url http://localhost:4566 dynamodb create-table --table-name papert-sessions --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE

      - name: Seymour unit and database tests with coverage
        working-directory: apps/seymour
        run: |
          test -n "$SEYMOUR_TEST_DATABASE_URL"
          python -m coverage run --source=src -m pytest -m 'unit or integration' -v
          python -m coverage xml

      - name: Offline model evaluation gate
        working-directory: apps/seymour
        run: python -m evals.ci --offline

      - name: Ingestion unit and database tests with coverage
        working-directory: apps/ingestion
        run: |
          test -n "$INGESTION_TEST_DATABASE_URL"
          python -m coverage run --source=src -m pytest -m 'unit or integration' -v
          python -m coverage xml

      - name: Queue redrive smoke
        run: make smoke-queue

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            apps/core/coverage/
            apps/seymour/coverage.xml
            apps/ingestion/coverage.xml

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        env:
          NODE_V8_COVERAGE: coverage
        run: npm test

      - name: Test generated type packs
        run: npm run test:type-packs

      - name: Build
        run: npm run build

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  e2e:
    name: Browser end-to-end (fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the fake-model stack
        run: make e2e-up

      - name: Run browser tests
        run: make e2e-test

      - name: Collect stack logs
        if: failure()
        run: make e2e-logs > e2e-stack.log 2>&1

      - name: Upload traces, screenshots and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure
          path: |
            apps/web/e2e/test-results/
            apps/web/e2e/playwright-report/
            e2e-stack.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: make e2e-down
