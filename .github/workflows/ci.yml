name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_COLOR: "1"

jobs:
  # ── Core API (NestJS) ───────────────────────────────────────────────────────
  core:
    name: Core — lint, build, test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: papert
          POSTGRES_USER: core_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_user -d papert"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://core_user:ci-only-password@localhost:5432/papert?schema=core
      AUTH_TEST_DATABASE_URL: postgresql://core_user:ci-only-password@localhost:5432/papert?schema=core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/core/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Migrate test database
        run: |
          psql "postgresql://core_user:ci-only-password@localhost:5432/papert" -c 'CREATE SCHEMA IF NOT EXISTS core AUTHORIZATION core_user;'
          npx prisma migrate deploy

      - name: HTTP and database tests
        run: npm run test:e2e

  # ── Seymour API (FastAPI) ───────────────────────────────────────────────────
  seymour:
    name: Seymour — lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seymour

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/seymour/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -m "not integration" -v

  # ── Prisma schema validation ────────────────────────────────────────────────
  core-migration-check:
    name: Core — Prisma schema validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/core/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate

  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
