name: Paid model evaluations

on:
  pull_request:
    paths:
      - apps/seymour/src/**/prompts.py
      - apps/seymour/src/**/evaluator.py
      - apps/seymour/evals/**
      - apps/seymour/requirements*.txt
      - .github/workflows/evaluations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paid-evaluations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Capped model evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_SPEND_CAP_USD: "0.25"
    defaults:
      run:
        working-directory: apps/seymour
    steps:
      - name: Check evaluation credentials
        id: credentials
        working-directory: .
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$LANGFUSE_BASE_URL" ] && [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Paid evaluations skipped: required secrets are absent."
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.credentials.outputs.ready == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/seymour/requirements*.txt

      - name: Install evaluation dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Evaluate models under spend cap
        if: steps.credentials.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: python -m evals.ci
