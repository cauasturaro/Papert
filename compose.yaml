services:
  postgres:
    profiles: [legacy]
    image: pgvector/pgvector@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: papert
      POSTGRES_USER: papert_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make up}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro

  floci:
    image: floci/floci@sha256:954ea3f472c85c569569ab81d8e79a28dd15a769c10ab8374c106537aa45fc1d
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:7001:7001"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: papert-local
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: papert-pgvector:18-trixie
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7001"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make up}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
      - ./infra/floci/ensure-rds.py:/setup/ensure-rds.py:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    profiles: [tools]
    image: pgvector/pgvector@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      PGHOST: floci
      PGPORT: "7001"
      PGUSER: papert_admin
      PGDATABASE: papert
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run make up}
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - ./infra/postgres:/setup:ro
    entrypoint: [psql, -v, ON_ERROR_STOP=1]

  # Start the complete local stack with make up-all.

  core:
    profiles: [apps]
    build:
      context: ./apps/core
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: development
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?Run make auth-env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AUTH_JWE_ACTIVE_KID: ${AUTH_JWE_ACTIVE_KID:-}
      AUTH_JWE_KEYS: ${AUTH_JWE_KEYS:-}
      DATABASE_URL: postgresql://core_user:${CORE_DB_PASSWORD:?Run make up}@floci:7001/papert?schema=core
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CHAT_QUEUE_URL: http://floci:4566/000000000000/papert-chat
      RESULTS_QUEUE_URL: http://floci:4566/000000000000/papert-results
      SESSIONS_TABLE: papert-sessions
      SOURCES_BUCKET: papert-sources
      SOURCES_PUBLIC_S3_ENDPOINT: http://localhost:4566
      # Learner feedback is sent to the execution's Langfuse trace.
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  seymour:
    profiles: [apps]
    build:
      context: ./apps/seymour
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      SEYMOUR_DATABASE_URL: postgresql+asyncpg://seymour_user:${SEYMOUR_DB_PASSWORD:?Run make up}@floci:7001/papert
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=5))['status'] == 'ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  execution-runner:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/runner/Dockerfile
    # Keep the runner's AWS and control endpoints on loopback inside Floci's network namespace.
    network_mode: service:floci
    environment:
      DATABASE_URL: postgresql://core_user:${CORE_DB_PASSWORD:?Run make up}@localhost:7001/papert?schema=core
      AUTH_JWE_ACTIVE_KID: ${AUTH_JWE_ACTIVE_KID:-}
      AUTH_JWE_KEYS: ${AUTH_JWE_KEYS:-}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CHAT_QUEUE_URL: http://localhost:4566/000000000000/papert-chat
      RESULTS_QUEUE_URL: http://localhost:4566/000000000000/papert-results
      SESSIONS_TABLE: papert-sessions
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano-2026-03-17}
      # Optional fallback provider; leave the key empty to run on OpenAI only.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      SEYMOUR_DATABASE_URL: postgresql://seymour_user:${SEYMOUR_DB_PASSWORD:?Run make up}@localhost:7001/papert
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      core:
        condition: service_healthy
      seymour:
        condition: service_healthy
      floci:
        condition: service_healthy

  ingestion-runner:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/runner/Dockerfile
    network_mode: service:floci
    command: ["node", "apps/core/dist/sources/infrastructure/local-worker.js"]
    environment:
      DATABASE_URL: postgresql://core_user:${CORE_DB_PASSWORD:?Run make up}@localhost:7001/papert?schema=core
      # Core's application module validates its configuration at startup.
      AUTH_JWE_ACTIVE_KID: ${AUTH_JWE_ACTIVE_KID:-}
      AUTH_JWE_KEYS: ${AUTH_JWE_KEYS:-}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INGESTION_QUEUE_URL: http://localhost:4566/000000000000/papert-ingestion
      SOURCES_BUCKET: papert-sources
      SEYMOUR_DATABASE_URL: postgresql://seymour_user:${SEYMOUR_DB_PASSWORD:?Run make up}@localhost:7001/papert
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      core:
        condition: service_healthy
      floci:
        condition: service_healthy

  web:
    profiles: [apps]
    build:
      context: ./apps/web
      args:
        CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-http://localhost:4566}
    environment:
      CORE_API_URL: http://core:3001
      TRUSTED_PROXY_COUNT: "1"
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?Run make auth-env}
    depends_on:
      - core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingress:
    profiles: [apps]
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./infra/ingress/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-migrate:
    profiles: [tools]
    build:
      context: ./apps/core
    environment:
      DATABASE_URL: postgresql://core_user:${CORE_DB_PASSWORD:?Run make up}@floci:7001/papert?schema=core
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]

  seymour-migrate:
    profiles: [tools]
    build:
      context: ./apps/seymour
    environment:
      SEYMOUR_DATABASE_URL: postgresql+asyncpg://seymour_user:${SEYMOUR_DB_PASSWORD:?Run make up}@floci:7001/papert
    command: ["python", "-m", "alembic", "upgrade", "head"]

volumes:
  postgres_data:
  floci_data:

networks:
  default:
    name: papert-local
